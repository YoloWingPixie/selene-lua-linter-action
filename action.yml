name: 'Selene Lua Linter Action'
description: 'Lint Lua code with a prebuilt Selene container and GitHub annotations.'
author: 'YoloWingPixie'
branding:
  icon: 'moon'
  color: 'purple'
inputs:
  working-directory:
    description: >
      Directory where Selene will be executed, relative to
      repository root.
    required: false
    default: '.'
  config-path:
    description: >
      Path to Selene configuration file (e.g., selene.toml),
      relative to repository root.
    required: true
  lint-path:
    description: 'File or directory to lint, relative to `working-directory`.'
    required: false
    default: '.'
  selene-args:
    description: 'Additional arguments to pass directly to the Selene CLI.'
    required: false
    default: ''
  fail-on-warnings:
    description: >
      If true, the action fails if Selene reports any warnings
      (exit code 1).
    required: false
    default: 'false'
  report-as-annotations:
    description: >
      If true, Selene findings are reported as GitHub code
      annotations.
    required: false
    default: 'true'
  selene-version:
    description: >
      Deprecated and ignored. The action uses the Selene version packaged in
      its release image.
    required: false
    default: '0.30.1'
  selene-repo:
    description: >
      Deprecated and ignored. The packaged Selene release is used.
    required: false
    default: 'Kampfkarren/selene'
  selene-variant:
    description: 'Packaged Selene variant to run: selene or selene-light.'
    required: false
    default: 'selene'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/yolowingpixie/selene-lua-linter-action:v1.0.0'
  args:
    - '--working-directory'
    - ${{ inputs.working-directory }}
    - '--config-path'
    - ${{ inputs.config-path }}
    - '--lint-path'
    - ${{ inputs.lint-path }}
    - '--selene-args'
    - ${{ inputs.selene-args }}
    - '--fail-on-warnings'
    - ${{ inputs.fail-on-warnings }}
    - '--report-as-annotations'
    - ${{ inputs.report-as-annotations }}
    - '--selene-variant'
    - ${{ inputs.selene-variant }}
