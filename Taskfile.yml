version: "3"

vars:
  IMAGE_NAME: selene-lua-linter-action:test
  PROJECT_DIR: "{{.TASK_DIR}}"

tasks:
  default:
    cmds:
      - task --list

  format:
    desc: Format Go source
    cmds:
      - gofmt -w cmd

  format:ci:
    desc: Check Go formatting
    cmds:
      - test -z "$(gofmt -l cmd)"

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  build:
    desc: Build the action image
    cmds:
      - docker build --tag {{.IMAGE_NAME}} .

  test:image:success:
    desc: Run successful image integration cases
    cmds:
      - >-
        docker run --rm
        -v "{{.PROJECT_DIR}}:/github/workspace"
        -e GITHUB_WORKSPACE=/github/workspace
        {{.IMAGE_NAME}}
        --config-path ci-test-files/basic-lint/selene.toml
        --lint-path ci-test-files/basic-lint
        --report-as-annotations true
        --fail-on-warnings false
      - >-
        docker run --rm
        -v "{{.PROJECT_DIR}}:/github/workspace"
        -e GITHUB_WORKSPACE=/github/workspace
        {{.IMAGE_NAME}}
        --working-directory ci-test-files/working-dir-test/sub/dir
        --config-path selene_config.toml
        --lint-path .
      - >-
        docker run --rm
        -v "{{.PROJECT_DIR}}:/github/workspace"
        -e GITHUB_WORKSPACE=/github/workspace
        {{.IMAGE_NAME}}
        --config-path ci-test-files/specific-file-test/selene.toml
        --lint-path ci-test-files/specific-file-test/good.lua
        --fail-on-warnings true
      - >-
        docker run --rm
        -v "{{.PROJECT_DIR}}:/github/workspace"
        -e GITHUB_WORKSPACE=/github/workspace
        {{.IMAGE_NAME}}
        --config-path ci-test-files/selene-args-test/selene.toml
        --lint-path ci-test-files/selene-args-test/ugly.lua
        --selene-args "--display-style quiet"
        --report-as-annotations false
      - >-
        docker run --rm
        -v "{{.PROJECT_DIR}}:/github/workspace"
        -e GITHUB_WORKSPACE=/github/workspace
        {{.IMAGE_NAME}}
        --config-path ci-test-files/selene-light-test/selene.toml
        --lint-path ci-test-files/selene-light-test
        --selene-variant selene-light

  test:image:failure:
    desc: Verify failing image integration cases
    cmds:
      - cmd: |
          set +e
          docker run --rm \
            -v "{{.PROJECT_DIR}}:/github/workspace" \
            -e GITHUB_WORKSPACE=/github/workspace \
            {{.IMAGE_NAME}} \
            --config-path ci-test-files/fail-on-warn-test/selene.toml \
            --lint-path ci-test-files/fail-on-warn-test/warning.lua \
            --fail-on-warnings true
          action_exit_code=$?
          set -e
          if [ "$action_exit_code" -ne 1 ]; then
            echo "Expected fail-on-warnings to exit 1; got $action_exit_code"
            exit 1
          fi
      - cmd: |
          set +e
          docker run --rm \
            -v "{{.PROJECT_DIR}}:/github/workspace" \
            -e GITHUB_WORKSPACE=/github/workspace \
            {{.IMAGE_NAME}} \
            --config-path ci-test-files/specific-file-test/selene.toml \
            --lint-path ci-test-files/specific-file-test/bad.lua \
            --fail-on-warnings true
          action_exit_code=$?
          set -e
          if [ "$action_exit_code" -ne 1 ]; then
            echo "Expected the invalid file to exit 1; got $action_exit_code"
            exit 1
          fi
      - cmd: |
          set +e
          docker run --rm \
            -v "{{.PROJECT_DIR}}:/github/workspace" \
            -e GITHUB_WORKSPACE=/github/workspace \
            {{.IMAGE_NAME}} \
            --config-path ci-test-files/syntax-error-test/selene.toml \
            --lint-path ci-test-files/syntax-error-test/syntax_error.lua
          action_exit_code=$?
          set -e
          if [ "$action_exit_code" -ne 1 ]; then
            echo "Expected the syntax error to exit 1; got $action_exit_code"
            exit 1
          fi

  test:image:
    desc: Run image integration tests
    deps: [build]
    cmds:
      - task: test:image:success
      - task: test:image:failure

  ci:
    desc: Run all repository checks
    cmds:
      - task: format:ci
      - task: lint
      - task: test
      - task: test:image
